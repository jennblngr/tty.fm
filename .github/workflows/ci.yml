# Checks every pull request (and main after a merge): the Go server, the
# Flutter app and the Python recommender are each formatted, linted and
# tested; the server and the app are also compiled.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run still going for the previous one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Format
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Not gofmt'ed (run gofmt -w .):"; echo "$unformatted"; exit 1
          fi
      - name: Vet
        run: make vet
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: server
      - name: Unit tests
        run: go test -tags sqlite_fts5 -race ./...
      - name: Build
        run: make build

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      # Compiles the Android app; release builds fall back to the debug key
      # when no key.properties is present.
      - name: Build (Android, debug)
        run: flutter build apk --debug

  recommender:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recommender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: recommender/requirements.txt
      - run: pip install -r requirements.txt ruff==0.17.3
      # Essentia's ML models (~25 MB), cached until their list changes.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/essentia-models
          key: essentia-models-${{ hashFiles('recommender/ttyfm_recommender/models.py') }}
      - run: python -m ttyfm_recommender.models ${{ runner.temp }}/essentia-models
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      # Includes an end-to-end analysis of a synthetic file with Essentia,
      # ML models included.
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
        env:
          TTYFM_MODELS_DIR: ${{ runner.temp }}/essentia-models
          TF_CPP_MIN_LOG_LEVEL: "2"
