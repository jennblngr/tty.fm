# Copy .env.example to .env and adjust paths/password before the first start.
services:
  server:
    build:
      context: ./server
      args:
        VERSION: ${VERSION:-dev}
    # The NAS is x86_64; pinning the platform also makes builds on Apple
    # Silicon produce the right image.
    platform: linux/amd64
    image: ${APP_NAME:-selfstream}:latest
    container_name: ${APP_NAME:-selfstream}
    restart: unless-stopped
    # UGOS Pro refuses inotify watches on shared folders to non-root users,
    # so the container runs as uid 0 but with every capability dropped: it
    # cannot bypass file permissions, and the music is mounted read-only.
    # On other hosts, set PUID/PGID to the user owning the folders.
    user: "${PUID:-0}:${PGID:-0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${PORT:-4533}:4533"
    environment:
      SELFSTREAM_ADMIN_USER: ${ADMIN_USER:-admin}
      SELFSTREAM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SELFSTREAM_WATCH: ${WATCH:-true}
      SELFSTREAM_WATCH_DEBOUNCE: ${WATCH_DEBOUNCE:-10s}
      SELFSTREAM_SCAN_INTERVAL: ${SCAN_INTERVAL:-1h}
      SELFSTREAM_TRANSCODE_CACHE_MB: ${TRANSCODE_CACHE_MB:-2048}
      SELFSTREAM_LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ${DATA_DIR:?set DATA_DIR in .env}:/data
