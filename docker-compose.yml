# Copy .env.example to .env and adjust paths/password before the first start.
services:
  server:
    build:
      context: ./server
      args:
        VERSION: ${VERSION:-dev}
    # The NAS is x86_64; pinning the platform also makes builds on Apple
    # Silicon produce the right image.
    platform: linux/amd64
    image: ${APP_NAME:-ttyfm}:latest
    container_name: ${APP_NAME:-ttyfm}
    restart: unless-stopped
    # UGOS Pro refuses inotify watches on shared folders to non-root users,
    # so the container runs as uid 0 but with every capability dropped: it
    # cannot bypass file permissions, and the music is mounted read-only.
    # On other hosts, set PUID/PGID to the user owning the folders.
    user: "${PUID:-0}:${PGID:-0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "${PORT:-4533}:4533"
    environment:
      TTYFM_ADMIN_USER: ${ADMIN_USER:-admin}
      TTYFM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TTYFM_WATCH: ${WATCH:-true}
      TTYFM_WATCH_DEBOUNCE: ${WATCH_DEBOUNCE:-10s}
      TTYFM_SCAN_INTERVAL: ${SCAN_INTERVAL:-1h}
      TTYFM_TRANSCODE_CACHE_MB: ${TRANSCODE_CACHE_MB:-2048}
      TTYFM_LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ${DATA_DIR:?set DATA_DIR in .env}:/data

  # Audio analysis (phase 3): reads the music folder (read-only), takes its
  # queue from the server and reports bpm, key, loudness... through the API.
  # Background work at low CPU priority; stop the service to pause it.
  recommender:
    build:
      context: ./recommender
      args:
        VERSION: ${VERSION:-dev}
    platform: linux/amd64
    image: ${APP_NAME:-ttyfm}-recommender:latest
    container_name: ${APP_NAME:-ttyfm}-recommender
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      server:
        condition: service_healthy
    environment:
      TTYFM_SERVER_URL: http://server:4533
      TTYFM_ADMIN_USER: ${ADMIN_USER:-admin}
      TTYFM_ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      TTYFM_ANALYSIS_WORKERS: ${ANALYSIS_WORKERS:-1}
      TTYFM_LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: ${TZ:-Europe/Paris}
    volumes:
      - ${MUSIC_DIR:?set MUSIC_DIR in .env}:/music:ro
      - ${DATA_DIR:?set DATA_DIR in .env}/recommender:/state
