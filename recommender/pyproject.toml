[project]
name = "ttyfm-recommender"
version = "0.1.0"
description = "tty.fm recommender service: audio analysis, new releases (MusicBrainz) and similar artists (ListenBrainz)"
requires-python = ">=3.12"
dependencies = [
  "essentia-tensorflow==2.1b6.dev1389",
  "numpy>=1.26",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
